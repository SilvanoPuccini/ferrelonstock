# Base de datos externa: Neon (free, no expira). NO crear Postgres de Render (expira a los 30 días).
# En el dashboard de Render, setear DATABASE_URL con el connection string de Neon.
services:
  - type: web
    name: ferrelonstock
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ferrelonstock.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SHIPPING_WEBHOOK_SECRET
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SETTINGS_MODULE
        value: "ferrelonstock.settings"
