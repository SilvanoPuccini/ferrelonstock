{% load i18n %}

{% if user.is_authenticated %}
<button
    hx-post="{% if in_wishlist %}{% url 'wishlist:remove' product.id %}{% else %}{% url 'wishlist:add' product.id %}{% endif %}"
    hx-vals='{"csrfmiddlewaretoken": "{{ csrf_token }}"}'
    hx-swap="none"
    title="{% if in_wishlist %}{% trans 'Quitar de favoritos' %}{% else %}{% trans 'Agregar a favoritos' %}{% endif %}"
    class="w-full flex items-center justify-center gap-2 py-3.5 px-6 rounded-xl font-semibold transition text-sm border
        {% if in_wishlist %}bg-red-50 text-red-600 border-red-200 hover:bg-red-100{% else %}bg-white text-gray-600 border-gray-300 hover:text-red-600 hover:border-red-300{% endif %}">
    {% if in_wishlist %}
    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
    {% trans "En favoritos" %}
    {% else %}
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
    {% trans "Agregar a favoritos" %}
    {% endif %}
</button>
{% endif %}
