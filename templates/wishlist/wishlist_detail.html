{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Mis favoritos" %}{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <nav class="flex mb-6 text-sm text-gray-500">
        <a href="{% url 'core:home' %}" class="hover:text-primary-600">{% trans "Inicio" %}</a>
        <span class="mx-2">/</span>
        <span class="text-gray-900 font-medium">{% trans "Mis favoritos" %}</span>
    </nav>

    <h1 class="text-2xl font-bold text-gray-900 mb-8">{% trans "Mis favoritos" %}</h1>

    <div id="wishlist-items"
        hx-get="{% url 'wishlist:detail' %}"
        hx-trigger="wishlistUpdated from:body"
        hx-swap="innerHTML">
        {% include 'wishlist/_wishlist_items.html' %}
    </div>
</div>
{% endblock %}
